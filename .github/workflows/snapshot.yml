name: Daily snapshot

on:
  workflow_dispatch:   # run by hand from the Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run snapshot
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          uv run python src/db.py
          uv run python src/universe.py
          uv run python src/snapshot.py
